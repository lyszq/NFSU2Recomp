name: NFSU2iOS
options:
  bundleIdPrefix: dev.lyszq
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: 'NO'
    CODE_SIGNING_ALLOWED: 'NO'
    ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
targets:
  NFSU2iOS:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: NFSU2iOS
      - path: ../runtime/guest_memory.c
      - path: tests/cpu_flags_test.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lyszq.nfsu2ios
        PRODUCT_NAME: NFSU2iOS
        GCC_STRICT_ALIASING: 'NO'
        GCC_C_LANGUAGE_STANDARD: gnu11
        LD_GENERATE_MAP_FILE: 'YES'
        SWIFT_OBJC_BRIDGING_HEADER: NFSU2iOS/Native/NFSU2BridgingHeader.h
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    info:
      path: NFSU2iOS/Info.plist
      properties:
        CFBundleDisplayName: NFSU2 iOS
        CFBundleShortVersionString: '0.3.0'
        CFBundleVersion: '3'
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
